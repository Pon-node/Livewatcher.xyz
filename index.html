<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#00e5a0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="LiveWatch" />
<link rel="manifest" href="manifest.json" />
<title>LiveWatch · Livepeer Delegator Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #050a0e; --surface: #0c1419; --border: #1a2830; --border2: #243540;
    --text: #e8f4f0; --muted: #4a7a8a; --accent: #00e5a0; --accent2: #00b8ff;
    --warn: #ff6b35; --danger: #ff3b5c;
    --font-display: 'Syne', sans-serif; --font-mono: 'IBM Plex Mono', monospace;
  }
  body { background: var(--bg); color: var(--text); font-family: var(--font-mono); min-height: 100vh; overflow-x: hidden; }
  body::before {
    content: ''; position: fixed; inset: 0;
    background-image: linear-gradient(rgba(0,229,160,.03) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(0,229,160,.03) 1px, transparent 1px);
    background-size: 40px 40px; pointer-events: none; z-index: 0;
  }
  #root { position: relative; z-index: 1; }
  .app { max-width: 1100px; margin: 0 auto; padding: 32px 24px 80px; }

  .header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid var(--border); gap: 16px; flex-wrap: wrap; }
  .logo { font-family: var(--font-display); font-size: 28px; font-weight: 800; letter-spacing: -0.5px; }
  .logo span { color: var(--accent); }
  .logo small { display: block; font-family: var(--font-mono); font-size: 11px; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; margin-top: 2px; }
  .live-dot { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); letter-spacing: 1px; }
  .live-dot .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: pulse 2s infinite; flex-shrink: 0; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.8)} }

  .wallets-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
  .wallet-chip { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border2); border-radius: 20px; padding: 6px 14px; font-size: 11px; cursor: pointer; transition: all .15s; }
  .wallet-chip:hover { border-color: var(--accent); }
  .wallet-chip.active { background: rgba(0,229,160,.12); border-color: var(--accent); color: var(--accent); }
  .wallet-chip .x { color: var(--muted); padding-left: 4px; border-left: 1px solid var(--border2); margin-left: 4px; }
  .wallet-chip .x:hover { color: var(--danger); }

  .search-wrap { display: flex; gap: 12px; margin-bottom: 16px; }
  .search-input { flex: 1; background: var(--surface); border: 1px solid var(--border2); border-radius: 4px; padding: 14px 18px; font-family: var(--font-mono); font-size: 13px; color: var(--text); outline: none; transition: border-color .2s; min-width: 0; }
  .search-input::placeholder { color: var(--muted); }
  .search-input:focus { border-color: var(--accent); }

  .btn { background: var(--accent); color: var(--bg); border: none; border-radius: 4px; padding: 14px 28px; font-family: var(--font-display); font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: opacity .2s, transform .1s; white-space: nowrap; }
  .btn:hover { opacity: .85; }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-ghost { background: transparent; border: 1px solid var(--border2); color: var(--muted); font-family: var(--font-mono); font-size: 11px; padding: 8px 14px; border-radius: 3px; cursor: pointer; transition: border-color .2s, color .2s; white-space: nowrap; }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn-ghost.danger:hover { border-color: var(--danger); color: var(--danger); }

  .controls-bar { display: flex; gap: 8px; margin-bottom: 24px; flex-wrap: wrap; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 24px; margin-bottom: 20px; }
  .card-title { font-family: var(--font-display); font-size: 11px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .badge { font-size: 10px; padding: 3px 8px; border-radius: 2px; letter-spacing: 1px; }
  .badge-active { background: rgba(0,229,160,.15); color: var(--accent); }
  .badge-soon { background: rgba(0,184,255,.15); color: var(--accent2); }

  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px; margin-bottom: 20px; }
  .stat { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 16px; }
  .stat-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .stat-value { font-size: 20px; font-weight: 600; color: var(--text); word-break: break-all; }
  .stat-value.accent { color: var(--accent); }
  .stat-value.accent2 { color: var(--accent2); }
  .stat-value.warn { color: var(--warn); }
  .stat-sub { font-size: 10px; color: var(--muted); margin-top: 4px; }

  .alerts-list { display: flex; flex-direction: column; gap: 10px; }
  .alert-item { display: flex; align-items: flex-start; gap: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 12px 16px; }
  .alert-item.warn { border-left: 3px solid var(--warn); }
  .alert-item.good { border-left: 3px solid var(--accent); }
  .alert-icon { font-size: 16px; line-height: 1; margin-top: 1px; }
  .alert-body { flex: 1; }
  .alert-msg { font-size: 12px; color: var(--text); line-height: 1.5; }
  .alert-time { font-size: 10px; color: var(--muted); margin-top: 3px; }
  .alert-dismiss { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; padding: 0; }
  .no-alerts { text-align: center; padding: 28px; color: var(--muted); font-size: 12px; letter-spacing: 1px; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: left; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--border); font-weight: 500; }
  td { padding: 11px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(255,255,255,.02); }
  .changed-rc { color: var(--warn); }
  .changed-rc::after { content: ' ▲'; font-size: 8px; }
  .td-mono { font-family: var(--font-mono); }

  .orch-header { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; padding: 16px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; }
  .orch-avatar { width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%); flex-shrink: 0; object-fit: cover; }
  .orch-info { flex: 1; min-width: 0; }
  .orch-name { font-family: var(--font-display); font-size: 18px; font-weight: 700; color: var(--text); }
  .orch-addr { font-family: var(--font-mono); font-size: 11px; color: var(--accent2); word-break: break-all; margin-top: 4px; }

  .row { display: flex; gap: 20px; }
  .row > * { flex: 1; }

  .empty { text-align: center; padding: 60px 24px; color: var(--muted); }
  .empty h2 { font-family: var(--font-display); font-size: 18px; font-weight: 700; margin-bottom: 8px; color: var(--text); }
  .empty p { font-size: 12px; line-height: 1.7; }
  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-msg { background: rgba(255,59,92,.1); border: 1px solid rgba(255,59,92,.3); border-radius: 4px; padding: 12px 16px; font-size: 11px; color: var(--danger); margin-bottom: 20px; white-space: pre-wrap; font-family: var(--font-mono); line-height: 1.6; }
  .footer-note { margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--border); font-size: 10px; color: var(--muted); text-align: center; letter-spacing: 1px; line-height: 1.7; }

  .toggle-group { display: flex; gap: 4px; background: var(--bg); padding: 4px; border-radius: 4px; width: fit-content; border: 1px solid var(--border); }
  .toggle-opt { padding: 6px 14px; border-radius: 3px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; background: none; border: none; color: var(--muted); font-family: var(--font-mono); transition: background .15s, color .15s; }
  .toggle-opt.active { background: var(--accent); color: var(--bg); font-weight: 600; }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .modal { background: var(--surface); border: 1px solid var(--border2); border-radius: 8px; max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 32px; }
  .modal-close { float: right; background: none; border: none; color: var(--muted); font-size: 24px; cursor: pointer; line-height: 1; }
  .modal-title { font-family: var(--font-display); font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  .modal-subtitle { font-size: 12px; color: var(--muted); margin-bottom: 24px; line-height: 1.6; }

  .channel-tabs { display: flex; gap: 8px; margin-bottom: 24px; border-bottom: 1px solid var(--border); }
  .channel-tab { padding: 12px 20px; cursor: pointer; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); background: none; border: none; border-bottom: 2px solid transparent; font-family: var(--font-mono); transition: all .2s; display: flex; align-items: center; gap: 8px; }
  .channel-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .channel-tab.disabled { opacity: 0.4; cursor: not-allowed; }

  .form-group { margin-bottom: 20px; }
  .form-label { display: block; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .form-input { width: 100%; background: var(--bg); border: 1px solid var(--border2); border-radius: 4px; padding: 12px 14px; color: var(--text); font-family: var(--font-mono); font-size: 12px; outline: none; transition: border-color .2s; }
  .form-input:focus { border-color: var(--accent); }
  .form-help { font-size: 11px; color: var(--muted); margin-top: 6px; line-height: 1.6; }
  .form-help a { color: var(--accent2); text-decoration: none; }

  .checkbox-group { display: flex; flex-direction: column; gap: 12px; }
  .checkbox-item { display: flex; align-items: flex-start; gap: 12px; cursor: pointer; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; transition: border-color .15s; }
  .checkbox-item:hover { border-color: var(--accent); }
  .checkbox-item input { margin-top: 2px; accent-color: var(--accent); cursor: pointer; }
  .checkbox-item .ck-text { flex: 1; }
  .checkbox-item .ck-title { font-size: 13px; font-weight: 600; color: var(--text); }
  .checkbox-item .ck-desc { font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.5; }

  .code-display { background: var(--bg); border: 2px solid var(--accent); border-radius: 4px; padding: 24px; text-align: center; margin: 20px 0; }
  .code-display .code { font-family: var(--font-mono); font-size: 36px; font-weight: 700; color: var(--accent); letter-spacing: 12px; }
  .code-display .code-help { font-size: 11px; color: var(--muted); margin-top: 12px; line-height: 1.6; }

  .sub-item { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; margin-bottom: 8px; }
  .sub-channel-icon { font-size: 20px; }
  .sub-info { flex: 1; min-width: 0; }
  .sub-title { font-size: 12px; color: var(--text); }
  .sub-meta { font-size: 10px; color: var(--muted); margin-top: 3px; word-break: break-all; }

  @media (max-width: 640px) {
    .row { flex-direction: column; }
    .header { flex-direction: column; align-items: flex-start; }
    .stats-grid { grid-template-columns: 1fr 1fr; }
    .modal { padding: 20px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useRef } = React;

// ─── Config ──────────────────────────────────────────────────────────────────
const API_BASE = "https://livepeer-network-api.cloudspe.com/api/v1";
const POLL_INTERVAL = 60_000;

// Each browser gets a permanent UUID on first load - used to scope subscriptions
function getOrCreateClientId() {
  let cid = localStorage.getItem("lw_client_id");
  if (!cid) {
    cid = crypto.randomUUID();
    localStorage.setItem("lw_client_id", cid);
  }
  return cid;
}
const CLIENT_ID = getOrCreateClientId();

// ─── API clients ─────────────────────────────────────────────────────────────
async function api(path, params = {}) {
  const qs = Object.entries(params)
    .filter(([_, v]) => v !== undefined && v !== null && v !== "")
    .map(([k, v]) => `${encodeURIComponent(k)}=${encodeURIComponent(v)}`)
    .join("&");
  const url = `${API_BASE}${path}${qs ? "?" + qs : ""}`;
  const res = await fetch(url);
  if (!res.ok) {
    let body = ""; try { body = (await res.json())?.error?.message || ""; } catch {}
    throw new Error(`API ${res.status}: ${path}${body ? " — " + body : ""}`);
  }
  return res.json();
}

function getBackend() { return "https://livewatch-backend.pon-node.workers.dev"; }

async function backend(path, opts = {}) {
  const base = getBackend();
  if (!base) throw new Error("Backend URL not configured. Click ⚙ Settings to add it.");
  const res = await fetch(`${base}${path}`, {
    ...opts,
    headers: {
      "Content-Type": "application/json",
      "X-Client-Id": CLIENT_ID,
      ...(opts.headers || {}),
    },
  });
  if (!res.ok) {
    let body = ""; try { body = (await res.json())?.error || ""; } catch {}
    throw new Error(`Backend ${res.status}: ${body || path}`);
  }
  return res.json();
}

// ─── Formatting ──────────────────────────────────────────────────────────────
function lpt(val) {
  if (val == null) return "—";
  const n = Number(val);
  if (n === 0) return "0.0000 LPT";
  if (n > 1e15) return (n / 1e18).toFixed(4) + " LPT";
  return n.toFixed(4) + " LPT";
}
function eth(val) {
  if (val == null) return "—";
  const n = Number(val);
  if (n === 0) return "0.0000 ETH";
  if (n > 1e15) return (n / 1e18).toFixed(6) + " ETH";
  return n.toFixed(6) + " ETH";
}
function usd(val) {
  if (val == null) return "—";
  return "$" + Number(val).toLocaleString(undefined, { maximumFractionDigits: 2 });
}
function pct(val) { return val == null ? "—" : Number(val).toFixed(2) + "%"; }
function shortAddr(addr) { return addr ? addr.slice(0, 6) + "…" + addr.slice(-4) : ""; }
function fmtDate(iso) { return iso ? new Date(iso).toLocaleDateString() : "—"; }
function fmtDateTime(d) {
  const dt = d instanceof Date ? d : new Date(d);
  return dt.toLocaleString(undefined, {
    day: "2-digit", month: "short", year: "numeric",
    hour: "2-digit", minute: "2-digit", second: "2-digit"
  });
}

// ─── Storage ─────────────────────────────────────────────────────────────────
const S = {
  getWallets: () => { try { return JSON.parse(localStorage.getItem("lw_wallets") || "[]"); } catch { return []; } },
  setWallets: (w) => localStorage.setItem("lw_wallets", JSON.stringify(w)),
  getActive: () => localStorage.getItem("lw_active") || "",
  setActive: (a) => localStorage.setItem("lw_active", a),
  setBackend: (u) => localStorage.setItem("lw_backend", u),
  getSnap: (addr) => { try { return JSON.parse(localStorage.getItem(`lw_snap_${addr}`) || "null"); } catch { return null; } },
  setSnap: (addr, snap) => localStorage.setItem(`lw_snap_${addr}`, JSON.stringify(snap)),
  getLinked: () => { try { return JSON.parse(localStorage.getItem("lw_tg_linked") || "null"); } catch { return null; } },
  setLinked: (data) => localStorage.setItem("lw_tg_linked", JSON.stringify(data)),
  getBrowserPrefs: () => {
    try { return JSON.parse(localStorage.getItem("lw_browser_prefs") || "null") || { enabled: false, reward_cut: true, fee_cut: true, missed_reward: true, claim_report: false }; }
    catch { return { enabled: false, reward_cut: true, fee_cut: true, missed_reward: true, claim_report: false }; }
  },
  setBrowserPrefs: (p) => localStorage.setItem("lw_browser_prefs", JSON.stringify(p)),
};

// ─── Browser notifications ────────────────────────────────────────────────────
function notifySupported() { return "Notification" in window; }
function notifPermission() { return notifySupported() ? Notification.permission : "denied"; }
async function requestNotifPermission() {
  if (!notifySupported()) return "denied";
  if (Notification.permission === "granted" || Notification.permission === "denied") return Notification.permission;
  return await Notification.requestPermission();
}
function showBrowserNotification(title, body, tag) {
  if (!notifySupported() || Notification.permission !== "granted") return;
  try {
    new Notification(title, {
      body,
      tag: tag || "livewatch",
      icon: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23050a0e'/%3E%3Ccircle cx='32' cy='32' r='12' fill='%2300e5a0'/%3E%3C/svg%3E",
    });
  } catch (e) { console.warn("notify failed", e); }
}

// ─── Main ─────────────────────────────────────────────────────────────────────
function App() {
  const [wallets, setWallets] = useState(S.getWallets());
  const [activeAddr, setActiveAddr] = useState(S.getActive());
  const [walletInput, setWalletInput] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [success, setSuccess] = useState(null);
  const [delegator, setDelegator] = useState(null);
  const [orchestrator, setOrchestrator] = useState(null);
  const [cutsHistory, setCutsHistory] = useState([]);
  const [stakeHistory, setStakeHistory] = useState([]);
  const [netEcon, setNetEcon] = useState(null);
  const [networkStats, setNetworkStats] = useState(null);
  const [alerts, setAlerts] = useState([]);
  const [lastPoll, setLastPoll] = useState(null);
  const [progress, setProgress] = useState("");
  const [econView, setEconView] = useState("orchestrator");
  const [showNotifs, setShowNotifs] = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const [subscriptions, setSubscriptions] = useState([]);

  const fetchAll = useCallback(async (addr) => {
    if (!addr) return;
    setLoading(true); setError(null);
    try {
      setProgress("Loading delegator…");
      const del = await api(`/delegators/${addr}`);
      setDelegator(del);

      if (!del.delegations || del.delegations.length === 0) {
        setError("Delegator has no active delegations.");
        setOrchestrator(null);
        return;
      }
      // API returns delegations sorted by bonded_principal DESC, but the largest
      // historical bond isn't necessarily the current one. The current delegation
      // is the one with the most recent as_of_block.
      const activeDelegation = [...del.delegations].sort((a, b) =>
        Number(b.as_of_block) - Number(a.as_of_block)
      )[0];
      // Store the chosen active delegation back into the delegator object so
      // myDelegation can pick it up consistently.
      del.activeDelegation = activeDelegation;
      const orchAddr = activeDelegation.delegate_address;

      setProgress("Loading orchestrator…");
      const [orch, cuts, stakeHist, netE, netStats] = await Promise.all([
        api(`/orchestrators/${orchAddr}`),
        api(`/orchestrators/${orchAddr}/cuts-history`),
        api(`/orchestrators/${orchAddr}/stake-history`),
        api(`/orchestrators/${orchAddr}/net-economics`, { period_days: 30 }),
        api(`/network/stats`).catch(() => null),
      ]);

      const prevSnap = S.getSnap(addr);
      const cutsData = cuts.data || [];
      const localAlerts = [];
      const browserPrefs = S.getBrowserPrefs();
      const now = new Date();
      if (prevSnap?.cuts && cutsData.length > 0 && prevSnap.cuts.length > 0) {
        if (cutsData[0].event_id !== prevSnap.cuts[0].event_id) {
          if (cutsData[0].reward_cut_percent !== prevSnap.cuts[0].reward_cut_percent) {
            const up = Number(cutsData[0].reward_cut_percent) > Number(prevSnap.cuts[0].reward_cut_percent);
            const msg = `Reward cut ${up?"↑":"↓"}: ${pct(prevSnap.cuts[0].reward_cut_percent)} → ${pct(cutsData[0].reward_cut_percent)}`;
            localAlerts.push({ id: Date.now()+1, type: up?"warn":"good", icon: up?"⚠️":"✅",
              msg, time: fmtDateTime(now) });
            if (browserPrefs.enabled && browserPrefs.reward_cut) {
              showBrowserNotification(`${up?"⚠️":"✅"} LiveWatch — Reward Cut ${up?"Increased":"Decreased"}`, msg, "reward_cut");
            }
          }
          if (cutsData[0].fee_cut_percent !== prevSnap.cuts[0].fee_cut_percent) {
            const up = Number(cutsData[0].fee_cut_percent) > Number(prevSnap.cuts[0].fee_cut_percent);
            const msg = `Fee cut ${up?"↑":"↓"}: ${pct(prevSnap.cuts[0].fee_cut_percent)} → ${pct(cutsData[0].fee_cut_percent)}`;
            localAlerts.push({ id: Date.now()+2, type: up?"warn":"good", icon: up?"⚠️":"✅",
              msg, time: fmtDateTime(now) });
            if (browserPrefs.enabled && browserPrefs.fee_cut) {
              showBrowserNotification(`${up?"⚠️":"✅"} LiveWatch — Fee Cut ${up?"Increased":"Decreased"}`, msg, "fee_cut");
            }
          }
        }
      }
      if (localAlerts.length) setAlerts(p => [...localAlerts, ...p].slice(0, 30));
      S.setSnap(addr, { cuts: cutsData });

      setOrchestrator(orch);
      setCutsHistory(cutsData);
      setStakeHistory(stakeHist.data || []);
      setNetEcon(netE);
      setNetworkStats(netStats);
      setLastPoll(new Date());
    } catch (e) { setError(e.message); }
    finally { setLoading(false); setProgress(""); }
  }, []);

  useEffect(() => {
    if (!activeAddr) return;
    fetchAll(activeAddr);
    const id = setInterval(() => fetchAll(activeAddr), POLL_INTERVAL);
    return () => clearInterval(id);
  }, [activeAddr, fetchAll]);

  // Load this client's subscriptions
  useEffect(() => {
    if (!getBackend()) { setSubscriptions([]); return; }
    backend(`/subscriptions?client_id=${CLIENT_ID}`)
      .then(r => setSubscriptions(r.subscriptions || []))
      .catch(() => setSubscriptions([]));
  }, [showNotifs]);

  const addWallet = () => {
    const t = walletInput.trim().toLowerCase();
    if (!/^0x[a-f0-9]{40}$/.test(t)) { setError("Invalid Ethereum address."); return; }
    setError(null);
    if (!wallets.includes(t)) {
      const updated = [...wallets, t];
      setWallets(updated); S.setWallets(updated);
    }
    S.setActive(t); setActiveAddr(t); setWalletInput(""); setAlerts([]);
  };
  const switchWallet = (addr) => { S.setActive(addr); setActiveAddr(addr); setAlerts([]); };
  const removeWallet = (addr, e) => {
    e.stopPropagation();
    const updated = wallets.filter(w => w !== addr);
    setWallets(updated); S.setWallets(updated);
    localStorage.removeItem(`lw_snap_${addr}`);
    if (activeAddr === addr) {
      const next = updated[0] || "";
      S.setActive(next); setActiveAddr(next);
      if (!next) { setDelegator(null); setOrchestrator(null); }
    }
  };

  const myDelegation = delegator?.activeDelegation || delegator?.delegations?.[0];
  const computeDelegatorEcon = () => {
    if (!netEcon || !orchestrator || !myDelegation) return null;
    const myStake = Number(myDelegation.bonded_principal);
    const totalStake = Number(orchestrator.total_stake);
    if (!totalStake || totalStake === 0) return null;
    const myShare = myStake / totalStake;
    const rewardCut = Number(orchestrator.reward_cut_percent) / 100;
    const feeCut = Number(orchestrator.fee_cut_percent) / 100;
    const myRewards = Number(netEcon.gross_rewards_usd) * (1 - rewardCut) * myShare;
    const myPayouts = Number(netEcon.gross_payouts_usd) * (1 - feeCut) * myShare;
    return {
      gross_rewards_usd: myRewards.toString(),
      gross_payouts_usd: myPayouts.toString(),
      gross_total_usd: (myRewards + myPayouts).toString(),
      gas_cost_native_eth: "0",
      period_days: netEcon.period_days,
    };
  };
  const econToShow = econView === "delegator" ? computeDelegatorEcon() : netEcon;

  return (
    <div className="app">
      <header className="header">
        <div className="logo">
          LIVEWATCH<span>.</span>
          <small>Livepeer Delegator Monitor · Arbitrum One</small>
        </div>
        <div className="live-dot">
          <span className="dot" />
          <span>{loading && progress ? progress : lastPoll ? `Last sync ${lastPoll.toLocaleTimeString()}` : "Awaiting data"}</span>
        </div>
      </header>

      {wallets.length > 0 && (
        <div className="wallets-bar">
          {wallets.map(w => (
            <div key={w} className={`wallet-chip ${w === activeAddr ? "active" : ""}`} onClick={() => switchWallet(w)}>
              <span>{shortAddr(w)}</span>
              <span className="x" onClick={(e) => removeWallet(w, e)}>✕</span>
            </div>
          ))}
        </div>
      )}

      <div className="search-wrap">
        <input className="search-input" placeholder="Add delegator wallet (0x…)" value={walletInput}
          onChange={e => setWalletInput(e.target.value)} onKeyDown={e => e.key === "Enter" && addWallet()} />
        <button className="btn" onClick={addWallet} disabled={loading}>
          {loading ? <><span className="spinner" />Sync</> : "Add"}
        </button>
      </div>

      <div className="controls-bar">
        <button className="btn-ghost" onClick={() => setShowNotifs(true)} disabled={!activeAddr}>
          🔔 Notifications {subscriptions.length > 0 ? `(${subscriptions.length})` : ""}
        </button>
      </div>

      {error && <div className="error-msg">⚠ {error}</div>}
      {success && <div className="error-msg" style={{background:"rgba(0,229,160,.1)",borderColor:"rgba(0,229,160,.3)",color:"var(--accent)"}}>✓ {success}</div>}

      {!delegator && !loading && !error && (
        <div className="empty">
          <h2>{wallets.length === 0 ? "Add your first delegator address" : "Select a wallet above"}</h2>
          <p>
            Track Livepeer delegator wallets,<br />
            get notified on Telegram when orchestrators change reward cuts,<br />
            miss rewards, or change fees.<br /><br />
            <span style={{color:"var(--accent)"}}>Powered by Livepeer Valuation API</span>
          </p>
        </div>
      )}

      {delegator && orchestrator && (
        <>
          <div className="orch-header">
            {orchestrator.avatar_url ? <img className="orch-avatar" src={orchestrator.avatar_url} alt="" /> : <div className="orch-avatar" />}
            <div className="orch-info">
              <div className="orch-name">{orchestrator.display_name || shortAddr(orchestrator.address)}</div>
              <div className="orch-addr">{orchestrator.address}</div>
            </div>
            {orchestrator.is_active && <span className="badge badge-active">Active</span>}
          </div>

          <div className="card">
            <div className="card-title"><span>Alerts ({alerts.length})</span>
              {alerts.length > 0 && <button className="btn-ghost" onClick={() => setAlerts([])}>Clear all</button>}
            </div>
            <div className="alerts-list">
              {alerts.length === 0 ? <div className="no-alerts">No alerts since last sync</div>
                : alerts.map(a => (
                  <div key={a.id} className={`alert-item ${a.type}`}>
                    <span className="alert-icon">{a.icon}</span>
                    <div className="alert-body"><div className="alert-msg">{a.msg}</div><div className="alert-time">{a.time}</div></div>
                    <button className="alert-dismiss" onClick={() => setAlerts(p => p.filter(x => x.id !== a.id))}>✕</button>
                  </div>
                ))}
            </div>
          </div>

          <div className="card">
            <div className="card-title">Your Position</div>
            <div className="stats-grid">
              <div className="stat"><div className="stat-label">Bonded</div><div className="stat-value accent">{lpt(myDelegation?.bonded_principal)}</div></div>
              <div className="stat"><div className="stat-label">Pending Stake</div><div className="stat-value">{lpt(myDelegation?.pending_stake)}</div></div>
              <div className="stat"><div className="stat-label">Pending Fees</div><div className="stat-value accent2">{eth(myDelegation?.pending_fees)}</div></div>
              <div className="stat"><div className="stat-label">Status</div><div className="stat-value" style={{fontSize:14, color: delegator.is_active ? "var(--accent)" : "var(--muted)"}}>{delegator.is_active ? "Active ✓" : "Inactive"}</div></div>
            </div>
          </div>

          <div className="row">
            <div className="card">
              <div className="card-title">Reward Cut</div>
              <div className="stat-value accent" style={{fontSize:36,fontWeight:700}}>{pct(orchestrator.reward_cut_percent)}</div>
              <div className="stat-sub">% kept by orchestrator from inflation rewards</div>
            </div>
            <div className="card">
              <div className="card-title">Fee Cut</div>
              <div className="stat-value accent2" style={{fontSize:36,fontWeight:700}}>{pct(orchestrator.fee_cut_percent)}</div>
              <div className="stat-sub">% kept by orchestrator from transcoding fees</div>
            </div>
            <div className="card">
              <div className="card-title">Total Stake</div>
              <div className="stat-value" style={{fontSize:28,fontWeight:700}}>{lpt(orchestrator.total_stake)}</div>
              <div className="stat-sub">Combined orch + delegator stake</div>
            </div>
          </div>

          {netEcon && (
            <div className="card">
              <div className="card-title">
                <span>30-Day Net Economics</span>
                <div className="toggle-group">
                  <button className={`toggle-opt ${econView === "orchestrator" ? "active" : ""}`} onClick={() => setEconView("orchestrator")}>Orchestrator</button>
                  <button className={`toggle-opt ${econView === "delegator" ? "active" : ""}`} onClick={() => setEconView("delegator")}>Delegator (You)</button>
                </div>
              </div>
              {econToShow ? (
                <div className="stats-grid">
                  <div className="stat">
                    <div className="stat-label">{econView === "orchestrator" ? "Gross Payouts" : "Your Payout Share"}</div>
                    <div className="stat-value accent">{usd(econToShow.gross_payouts_usd)}</div>
                    <div className="stat-sub">From transcoding tickets</div>
                  </div>
                  <div className="stat">
                    <div className="stat-label">{econView === "orchestrator" ? "Gross Rewards" : "Your Reward Share"}</div>
                    <div className="stat-value accent2">{usd(econToShow.gross_rewards_usd)}</div>
                    <div className="stat-sub">From inflation</div>
                  </div>
                  {econView === "orchestrator" && (
                    <div className="stat">
                      <div className="stat-label">Gas Cost</div>
                      <div className="stat-value warn">{eth(econToShow.gas_cost_native_eth)}</div>
                      <div className="stat-sub">Tx fees paid (ETH)</div>
                    </div>
                  )}
                  <div className="stat">
                    <div className="stat-label">{econView === "orchestrator" ? "Gross Total" : "Your Total"}</div>
                    <div className="stat-value">{usd(econToShow.gross_total_usd)}</div>
                    <div className="stat-sub">Payouts + rewards (USD)</div>
                  </div>
                </div>
              ) : (
                <div style={{color:"var(--muted)",fontSize:12,padding:16}}>Cannot compute delegator share — missing stake data.</div>
              )}
              {econView === "delegator" && (
                <div style={{fontSize:10,color:"var(--muted)",marginTop:8}}>
                  Estimated as (your bonded / total stake) × gross × (1 − cut). Excludes pending/unclaimed amounts.
                </div>
              )}
            </div>
          )}

          <div className="card">
            <div className="card-title">Cut Change History</div>
            <div className="table-wrap">
              <table>
                <thead><tr><th>Date</th><th>Reward Cut</th><th>Fee Cut</th><th>Fee Share</th><th>Block</th></tr></thead>
                <tbody>
                  {cutsHistory.length === 0
                    ? <tr><td colSpan={5} style={{textAlign:"center",color:"var(--muted)",padding:24}}>No cut changes on record</td></tr>
                    : cutsHistory.slice(0, 15).map((c, i) => {
                        const prev = cutsHistory[i+1];
                        const rcChanged = prev && c.reward_cut_percent !== prev.reward_cut_percent;
                        const fcChanged = prev && c.fee_cut_percent !== prev.fee_cut_percent;
                        return (
                          <tr key={c.event_id}>
                            <td>{fmtDate(c.block_timestamp)}</td>
                            <td className={rcChanged ? "changed-rc" : ""}>{pct(c.reward_cut_percent)}</td>
                            <td className={fcChanged ? "changed-rc" : ""}>{pct(c.fee_cut_percent)}</td>
                            <td>{pct(c.fee_share_percent)}</td>
                            <td className="td-mono">{c.block_number}</td>
                          </tr>);
                      })}
                </tbody>
              </table>
            </div>
          </div>

          {networkStats && (
            <div className="card">
              <div className="card-title">Network Context</div>
              <div className="stats-grid">
                <div className="stat"><div className="stat-label">Active Orchs</div><div className="stat-value">{networkStats.active_orchestrators}</div></div>
                <div className="stat"><div className="stat-label">Total LPT Staked</div><div className="stat-value accent">{lpt(networkStats.total_lpt_staked)}</div></div>
                <div className="stat"><div className="stat-label">Payouts 24h</div><div className="stat-value">{usd(networkStats.payouts_usd_24h)}</div></div>
                <div className="stat"><div className="stat-label">Rewards 24h</div><div className="stat-value">{usd(networkStats.rewards_usd_24h)}</div></div>
              </div>
            </div>
          )}

          <div className="footer-note">
            Data: livepeer-network-api.cloudspe.com<br />
            {`Backend: ${new URL(getBackend()).hostname} · checks every 30m`}<br />
            {wallets.length} wallet{wallets.length !== 1 ? "s" : ""} tracked · {subscriptions.length} subscription{subscriptions.length !== 1 ? "s" : ""}
          </div>
        </>
      )}

      {showSettings && (
        <SettingsModal onClose={() => setShowSettings(false)} onSave={(url) => { S.setBackend(url); window.location.reload(); }} />
      )}

      {showNotifs && activeAddr && (
        <NotificationsModal
          wallet={activeAddr}
          subscriptions={subscriptions}
          onClose={() => setShowNotifs(false)}
          onChange={() => backend(`/subscriptions?client_id=${CLIENT_ID}`).then(r => setSubscriptions(r.subscriptions || []))}
          setError={setError}
          setSuccess={setSuccess}
        />
      )}
    </div>
  );
}

function SettingsModal({ onClose, onSave }) {
  const [url, setUrl] = useState(getBackend());
  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <button className="modal-close" onClick={onClose}>✕</button>
        <div className="modal-title">Backend Settings</div>
        <div className="modal-subtitle">Configure your Cloudflare Worker URL to enable Telegram notifications.</div>
        <div className="form-group">
          <label className="form-label">Worker URL</label>
          <input className="form-input" placeholder="https://livewatch-backend.you.workers.dev" value={url} onChange={e => setUrl(e.target.value)} />
          <div className="form-help">Deploy the worker.js file to Cloudflare Workers and paste your worker URL here. See README for deployment steps.</div>
        </div>
        <button className="btn" onClick={() => onSave(url.replace(/\/$/, ""))}>Save</button>
      </div>
    </div>
  );
}

function NotificationsModal({ wallet, subscriptions, onClose, onChange, setError, setSuccess }) {
  const [section, setSection] = useState("telegram"); // 'telegram' | 'browser'
  const [channel, setChannel] = useState("telegram");
  const [notify, setNotify] = useState({ reward_cut: true, fee_cut: true, missed_reward: true, claim_report: false });
  const [tgCode, setTgCode] = useState(null);
  const [tgBotName, setTgBotName] = useState(null);
  const [tgChatId, setTgChatId] = useState(S.getLinked()?.chat_id || null);
  const [tgUsername, setTgUsername] = useState(S.getLinked()?.username || null);
  const [polling, setPolling] = useState(false);
  const [busy, setBusy] = useState(false);
  const [browserPrefs, setBrowserPrefs] = useState(S.getBrowserPrefs());
  const [permission, setPermission] = useState(notifPermission());
  const pollRef = useRef(null);

  const startTelegramLink = async () => {
    try {
      setBusy(true);
      const res = await backend("/telegram/link", { method: "POST", body: "{}" });
      setTgCode(res.code); setTgBotName(res.bot_username); setPolling(true);
      pollRef.current = setInterval(async () => {
        try {
          const r = await backend(`/telegram/poll/${res.code}`);
          if (r.linked) {
            clearInterval(pollRef.current); setPolling(false);
            setTgChatId(r.telegram_chat_id); setTgUsername(r.telegram_username);
            S.setLinked({ chat_id: r.telegram_chat_id, username: r.telegram_username });
            setSuccess("Telegram linked! Now select notification types and subscribe.");
            setTimeout(() => setSuccess(null), 4000);
          }
        } catch {}
      }, 2000);
      setTimeout(() => { if (pollRef.current) { clearInterval(pollRef.current); setPolling(false); } }, 600_000);
    } catch (e) { setError(e.message); }
    finally { setBusy(false); }
  };
  useEffect(() => () => { if (pollRef.current) clearInterval(pollRef.current); }, []);

  const createSub = async () => {
    if (!notify.reward_cut && !notify.fee_cut && !notify.missed_reward && !notify.claim_report) {
      setError("Select at least one notification type."); return;
    }
    try {
      setBusy(true);
      const body = {
        client_id: CLIENT_ID,
        wallet, channel,
        notify_reward_cut: notify.reward_cut,
        notify_fee_cut: notify.fee_cut,
        notify_missed_reward: notify.missed_reward,
        notify_claim_report: notify.claim_report,
        telegram_chat_id: tgChatId,
      };
      await backend("/subscriptions", { method: "POST", body: JSON.stringify(body) });
      setSuccess("Subscription created! Check Telegram for confirmation.");
      setTimeout(() => setSuccess(null), 4000);
      onChange();
    } catch (e) { setError(e.message); }
    finally { setBusy(false); }
  };

  const deleteSub = async (id) => {
    try {
      await backend(`/subscriptions/${id}`, { method: "DELETE" });
      onChange();
    } catch (e) { setError(e.message); }
  };

  const updateBrowserPrefs = (changes) => {
    const next = { ...browserPrefs, ...changes };
    setBrowserPrefs(next);
    S.setBrowserPrefs(next);
  };

  const toggleBrowserEnabled = async (enabled) => {
    if (enabled) {
      const perm = await requestNotifPermission();
      setPermission(perm);
      if (perm !== "granted") {
        setError("Notifications blocked by browser. Check site permissions.");
        return;
      }
      showBrowserNotification("LiveWatch — Notifications Enabled", "You'll be notified here when something happens.", "test");
    }
    updateBrowserPrefs({ enabled });
  };

  const canSubmit = channel === "telegram" && !!tgChatId;

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <button className="modal-close" onClick={onClose}>✕</button>
        <div className="modal-title">Notifications</div>
        <div className="modal-subtitle">Choose how you want to be alerted for <code style={{color:"var(--accent)"}}>{shortAddr(wallet)}</code>. Telegram works 24/7; browser notifications only fire while the page is loaded.</div>

        {/* Section tabs */}
        <div className="channel-tabs">
          <button className={`channel-tab ${section === "telegram" ? "active" : ""}`} onClick={() => setSection("telegram")}>📱 Telegram</button>
          <button className={`channel-tab ${section === "browser" ? "active" : ""}`} onClick={() => setSection("browser")}>🌐 Browser</button>
        </div>

        {section === "telegram" && (
          <>
            {subscriptions.length > 0 && (
              <div className="form-group">
                <label className="form-label">Your Active Telegram Subscriptions</label>
                {subscriptions.map(s => (
                  <div className="sub-item" key={s.id}>
                    <span className="sub-channel-icon">📱</span>
                    <div className="sub-info">
                      <div className="sub-title">
                        {shortAddr(s.wallet)}
                        {s.notify_reward_cut ? " · Reward cut" : ""}
                        {s.notify_fee_cut ? " · Fee cut" : ""}
                        {s.notify_missed_reward ? " · Missed reward" : ""}
                        {s.notify_claim_report ? " · Claim reports" : ""}
                      </div>
                      <div className="sub-meta">Telegram chat {s.telegram_chat_id}</div>
                    </div>
                    <button className="btn-ghost danger" onClick={() => deleteSub(s.id)}>✕ Remove</button>
                  </div>
                ))}
              </div>
            )}

            <div className="form-group">
              <label className="form-label">Link Telegram</label>
              {!tgChatId && !tgCode && (
                <button className="btn" onClick={startTelegramLink} disabled={busy}>
                  {busy ? <><span className="spinner" />Starting…</> : "Link Telegram"}
                </button>
              )}
              {tgCode && !tgChatId && (
                <div className="code-display">
                  <div className="code">{tgCode}</div>
                  <div className="code-help">
                    Open Telegram → message <strong>@{tgBotName}</strong> → send this code<br />
                    {polling && <><span className="spinner" />Waiting for your message…</>}
                  </div>
                </div>
              )}
              {tgChatId && (
                <div style={{padding:12,background:"var(--bg)",border:"1px solid var(--accent)",borderRadius:4,fontSize:12,color:"var(--accent)"}}>
                  ✓ Linked to {tgUsername ? `@${tgUsername}` : `chat ${tgChatId}`}
                </div>
              )}
            </div>

            <div className="form-group">
              <label className="form-label">Alert Notifications</label>
              <div className="checkbox-group">
                <label className="checkbox-item">
                  <input type="checkbox" checked={notify.reward_cut} onChange={e => setNotify(n => ({ ...n, reward_cut: e.target.checked }))} />
                  <div className="ck-text">
                    <div className="ck-title">Reward cut changes</div>
                    <div className="ck-desc">When the orchestrator changes the % they keep from inflation rewards.</div>
                  </div>
                </label>
                <label className="checkbox-item">
                  <input type="checkbox" checked={notify.fee_cut} onChange={e => setNotify(n => ({ ...n, fee_cut: e.target.checked }))} />
                  <div className="ck-text">
                    <div className="ck-title">Fee cut changes</div>
                    <div className="ck-desc">When the orchestrator adjusts the % they keep from transcoding fees.</div>
                  </div>
                </label>
                <label className="checkbox-item">
                  <input type="checkbox" checked={notify.missed_reward} onChange={e => setNotify(n => ({ ...n, missed_reward: e.target.checked }))} />
                  <div className="ck-text">
                    <div className="ck-title">Reward not claimed</div>
                    <div className="ck-desc">When the orchestrator misses calling reward() — you lose inflation rewards for that round.</div>
                  </div>
                </label>
              </div>
            </div>

            <div className="form-group">
              <label className="form-label">Detailed Claim Reports</label>
              <div className="checkbox-group">
                <label className="checkbox-item">
                  <input type="checkbox" checked={notify.claim_report} onChange={e => setNotify(n => ({ ...n, claim_report: e.target.checked }))} />
                  <div className="ck-text">
                    <div className="ck-title">Round claim reports</div>
                    <div className="ck-desc">When the orchestrator successfully claims rewards for a round, get a breakdown: total minted LPT, orchestrator share, delegators share, your share, and USD value at time of claim.</div>
                  </div>
                </label>
              </div>
            </div>

            <button className="btn" onClick={createSub} disabled={!canSubmit || busy} style={{width:"100%"}}>
              {busy ? <><span className="spinner" />Creating…</> : "Subscribe via Telegram"}
            </button>
          </>
        )}

        {section === "browser" && (
          <>
            <div className="form-group">
              <label className="form-label">Enable Browser Notifications</label>
              {!notifySupported() ? (
                <div style={{padding:12,background:"rgba(255,107,53,.1)",border:"1px solid rgba(255,107,53,.3)",borderRadius:4,fontSize:12,color:"var(--warn)"}}>
                  ⚠ Your browser doesn't support notifications.
                </div>
              ) : permission === "denied" ? (
                <div style={{padding:12,background:"rgba(255,59,92,.1)",border:"1px solid rgba(255,59,92,.3)",borderRadius:4,fontSize:12,color:"var(--danger)"}}>
                  Notifications blocked. Go to your browser's site settings for this page and allow notifications, then refresh.
                </div>
              ) : (
                <label className="checkbox-item" style={{cursor:"pointer"}}>
                  <input type="checkbox" checked={browserPrefs.enabled} onChange={e => toggleBrowserEnabled(e.target.checked)} />
                  <div className="ck-text">
                    <div className="ck-title">{browserPrefs.enabled ? "🔔 Enabled" : "🔕 Disabled"}</div>
                    <div className="ck-desc">Get desktop/mobile popups while LiveWatch is open. Tip: install as a PWA (Add to Home Screen) for better persistence on mobile.</div>
                  </div>
                </label>
              )}
            </div>

            {browserPrefs.enabled && (
              <div className="form-group">
                <label className="form-label">Which Events to Notify</label>
                <div className="checkbox-group">
                  <label className="checkbox-item">
                    <input type="checkbox" checked={browserPrefs.reward_cut} onChange={e => updateBrowserPrefs({ reward_cut: e.target.checked })} />
                    <div className="ck-text">
                      <div className="ck-title">Reward cut changes</div>
                      <div className="ck-desc">Popup when orchestrator changes reward cut.</div>
                    </div>
                  </label>
                  <label className="checkbox-item">
                    <input type="checkbox" checked={browserPrefs.fee_cut} onChange={e => updateBrowserPrefs({ fee_cut: e.target.checked })} />
                    <div className="ck-text">
                      <div className="ck-title">Fee cut changes</div>
                      <div className="ck-desc">Popup when orchestrator changes fee cut.</div>
                    </div>
                  </label>
                  <label className="checkbox-item">
                    <input type="checkbox" checked={browserPrefs.missed_reward} onChange={e => updateBrowserPrefs({ missed_reward: e.target.checked })} />
                    <div className="ck-text">
                      <div className="ck-title">Reward not claimed</div>
                      <div className="ck-desc">Popup when orchestrator misses a round.</div>
                    </div>
                  </label>
                  <label className="checkbox-item">
                    <input type="checkbox" checked={browserPrefs.claim_report} onChange={e => updateBrowserPrefs({ claim_report: e.target.checked })} />
                    <div className="ck-text">
                      <div className="ck-title">Claim reports</div>
                      <div className="ck-desc">Popup with claim breakdown when orchestrator claims rewards.</div>
                    </div>
                  </label>
                </div>
                <div style={{marginTop:12,fontSize:11,color:"var(--muted)",padding:12,background:"var(--bg)",border:"1px solid var(--border)",borderRadius:4}}>
                  💡 <strong>For mobile background notifications:</strong> use Telegram. Browser notifications only fire while the LiveWatch tab is open.
                </div>
              </div>
            )}
          </>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
