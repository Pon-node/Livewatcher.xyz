        <div className="modal-title">Notifications</div>
        <div className="modal-subtitle">Choose how to be alerted for <code style={{color:"var(--accent)"}}>{shortAddr(wallet)}</code>.</div>

        <div className="channel-tabs">
          <button className={`channel-tab ${section === "telegram" ? "active" : ""}`} onClick={() => setSection("telegram")}>📱 Telegram</button>
          <button className={`channel-tab ${section === "email" ? "active" : ""}`} onClick={() => setSection("email")}>📧 Email</button>
          <button className={`channel-tab ${section === "discord" ? "active" : ""}`} onClick={() => setSection("discord")}>🎮 Discord</button>
          <button className={`channel-tab ${section === "browser" ? "active" : ""}`} onClick={() => setSection("browser")}>🌐 Browser</button>
        </div>

        {section === "telegram" && (
          <>
            {renderSubList(
              subscriptions.filter(s => s.channel === "telegram" || !s.channel),
              "📱",
              "Your Active Telegram Subscriptions",
              s => s.channel === "telegram" ? `Telegram chat ${s.telegram_chat_id}` : s.channel === "email" ? `Email: ${s.email_address}` : s.channel === "discord" ? "Discord webhook" : s.channel
            )}

            <div className="form-group">
              <label className="form-label">Link Telegram</label>
              {!tgChatId && !tgCode && (
                <button className="btn" onClick={startTelegramLink} disabled={busy}>
                  {busy ? <><span className="spinner" />Starting…</> : "Link Telegram"}
                </button>
              )}
              {tgCode && !tgChatId && (
                <div className="code-display">
                  <div className="code">{tgCode}</div>
                  <div className="code-help">
                    Open Telegram → message <strong>@{tgBotName}</strong> → send this code<br />
                    {polling && <><span className="spinner" />Waiting for your message…</>}
                  </div>
                </div>
              )}
              {tgChatId && (
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:12,background:"var(--bg)",border:"1px solid var(--accent)",borderRadius:4,fontSize:12,color:"var(--accent)"}}>
                  <span>✓ Linked to {tgUsername ? `@${tgUsername}` : `chat ${tgChatId}`}</span>
                  <span style={{cursor:"pointer",color:"var(--muted)",fontSize:11}} onClick={unlinkTelegram}>Unlink</span>
                </div>
              )}
            </div>

            {notifyCheckboxes}

            <button className="btn" onClick={() => createSub("telegram")} disabled={!tgChatId || busy} style={{width:"100%"}}>
              {busy ? <><span className="spinner" />Creating…</> : "Subscribe via Telegram"}
            </button>
          </>
        )}

        {section === "email" && (
          <>
            {renderSubList(
              subscriptions.filter(s => s.channel === "email"),
              "📧",
              "Active Email Subscriptions",
              s => s.email_address
            )}
            <div className="form-group">
              <label className="form-label">Email Address</label>
              <input className="form-input" type="email" placeholder="you@example.com" value={emailAddress}
                disabled={emailCodeSent}
                onChange={e => { setEmailAddress(e.target.value); if (emailCodeSent) { setEmailCodeSent(false); setEmailCode(""); } }} />
              <div className="form-help">Alerts are sent via <a href="https://resend.com" target="_blank">Resend</a> from <code>alerts@livewatcher.xyz</code>. Check your spam folder if the code doesn't arrive.</div>
            </div>
            {notifyCheckboxes}
            {!emailCodeSent ? (
              <button className="btn" onClick={sendEmailCode} disabled={!emailAddress || emailSending} style={{width:"100%"}}>
                {emailSending ? <><span className="spinner" />Sending code…</> : "Send verification code"}
              </button>
            ) : (
              <>
                <div className="form-group">
                  <label className="form-label">Verification Code</label>
                  <input className="form-input" type="text" inputMode="numeric" maxLength={8} placeholder="8-digit code"
                    value={emailCode} onChange={e => setEmailCode(e.target.value.replace(/\D/g, "").slice(0, 8))} />
                  <div className="form-help">
                    Enter the 8-digit code sent to <code>{emailAddress}</code> (expires in 5 min).{" "}
                    <a href="#" onClick={e => { e.preventDefault(); if (!emailSending) sendEmailCode(); }}>Resend code</a>
                  </div>
                </div>
                <button className="btn" onClick={() => createSub("email")} disabled={emailCode.length !== 8 || busy} style={{width:"100%"}}>
                  {busy ? <><span className="spinner" />Verifying…</> : "Verify & Subscribe"}
                </button>
              </>
            )}
          </>
        )}

        {section === "discord" && (
          <>
            {renderSubList(
              subscriptions.filter(s => s.channel === "discord"),
              "🎮",
              "Active Discord Subscriptions",
              s => s.discord_username ? `@${s.discord_username}` : "Discord DM"
            )}
            <div className="form-group">
              <label className="form-label">Link Discord Account</label>
              {!discordUser && !discordLinking && (
                <button className="btn" onClick={startDiscordLink} disabled={busy}>
                  {busy ? <><span className="spinner" />Starting…</> : "🎮 Authorize with Discord"}
                </button>
              )}
              {discordLinking && (
                <div style={{padding:14,background:"var(--bg)",border:"1px solid var(--border2)",borderRadius:4,fontSize:12,color:"var(--muted)",lineHeight:1.6}}>
                  <span className="spinner" />Waiting for Discord authorization in popup window…<br/>
                  <span style={{fontSize:11}}>Complete the OAuth flow in the popup, then come back here.</span>
                </div>
              )}
              {discordUser && (
                <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:12,background:"var(--bg)",border:"1px solid var(--accent)",borderRadius:4,fontSize:12,color:"var(--accent)"}}>
                  <span>✓ {discordUser.discord_username}</span>
                  <span style={{cursor:"pointer",color:"var(--muted)",fontSize:11}} onClick={() => { setDiscordUser(null); S.setDiscordUser(null); }}>Unlink</span>
                </div>
              )}
              <div className="form-help" style={{marginTop:8}}>LiveWatch will send you direct messages on Discord when alerts fire. Link your account above to get started.</div>
            </div>
            {notifyCheckboxes}
            <button className="btn" onClick={() => createSub("discord")} disabled={!discordUser || busy} style={{width:"100%"}}>
              {busy ? <><span className="spinner" />Creating…</> : "Subscribe via Discord DM"}
            </button>
          </>
        )}

        {section === "browser" && (
          <>
            <div className="form-group">
              <label className="form-label">Enable Browser Notifications</label>
              {!notifySupported() ? (
                <div style={{padding:12,background:"rgba(255,107,53,.1)",border:"1px solid rgba(255,107,53,.3)",borderRadius:4,fontSize:12,color:"var(--warn)"}}>
                  ⚠ Your browser doesn't support notifications.
                </div>
              ) : permission === "denied" ? (
                <div style={{padding:12,background:"rgba(255,59,92,.1)",border:"1px solid rgba(255,59,92,.3)",borderRadius:4,fontSize:12,color:"var(--danger)"}}>
                  Notifications blocked. Go to your browser's site settings for this page and allow notifications, then refresh.
                </div>
              ) : (
                <label className="checkbox-item" style={{cursor:"pointer"}}>
                  <input type="checkbox" checked={browserPrefs.enabled} onChange={e => toggleBrowserEnabled(e.target.checked)} />
                  <div className="ck-text">
                    <div className="ck-title">{browserPrefs.enabled ? "🔔 Enabled" : "🔕 Disabled"}</div>
                    <div className="ck-desc">Get desktop/mobile popups while LiveWatch is open. Tip: install as a PWA (Add to Home Screen) for better persistence on mobile.</div>
                  </div>
                </label>
              )}
            </div>

            {browserPrefs.enabled && (
              <div className="form-group">
                <label className="form-label">Which Events to Notify</label>
                <div className="checkbox-group">
                  <label className="checkbox-item">
                    <input type="checkbox" checked={browserPrefs.reward_cut} onChange={e => updateBrowserPrefs({ reward_cut: e.target.checked })} />
                    <div className="ck-text">
                      <div className="ck-title">Reward cut changes</div>
                      <div className="ck-desc">Popup when orchestrator changes reward cut.</div>
                    </div>
                  </label>
                  <label className="checkbox-item">
                    <input type="checkbox" checked={browserPrefs.fee_cut} onChange={e => updateBrowserPrefs({ fee_cut: e.target.checked })} />
                    <div className="ck-text">
                      <div className="ck-title">Fee cut changes</div>
                      <div className="ck-desc">Popup when orchestrator changes fee cut.</div>
                    </div>
                  </label>
                  <label className="checkbox-item">
                    <input type="checkbox" checked={browserPrefs.missed_reward} onChange={e => updateBrowserPrefs({ missed_reward: e.target.checked })} />
                    <div className="ck-text">
                      <div className="ck-title">Reward not claimed</div>
                      <div className="ck-desc">Popup when orchestrator misses a round.</div>
                    </div>
                  </label>
                  <label className="checkbox-item">
                    <input type="checkbox" checked={browserPrefs.claim_report} onChange={e => updateBrowserPrefs({ claim_report: e.target.checked })} />
                    <div className="ck-text">
                      <div className="ck-title">Claim reports</div>
                      <div className="ck-desc">Popup with claim breakdown when orchestrator claims rewards.</div>
                    </div>
                  </label>
                </div>
                <div style={{marginTop:12,fontSize:11,color:"var(--muted)",padding:12,background:"var(--bg)",border:"1px solid var(--border)",borderRadius:4,lineHeight:1.6}}>
                  💡 <strong>Installed as PWA?</strong> Missed-reward checks run in the background even when the tab is closed (Android Chrome). On other platforms the tab must be open.<br/>
                  <strong>Best for 24/7 background alerts:</strong> use Telegram.
                </div>
              </div>
            )}
          </>
        )}
      </div>
    </div>
  );
}

// ─── Telegram Login Widget ────────────────────────────────────────────────────
// IMPORTANT: requires you to run /setdomain in @BotFather and enter your
// frontend domain (e.g. yourusername.github.io). Without that step,
// the widget will refuse to render the button.
function TelegramLoginButton({ onLogin }) {
  const containerRef = useRef(null);
  const [botUsername, setBotUsername] = useState(null);

  // Fetch bot username from backend (so we don't have to hardcode it client-side)
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        // Try to fetch from backend (uses our existing /telegram/link as it returns bot_username)
        const r = await backend(`/telegram/link`, { method: "POST", body: "{}" });
        if (!cancelled && r.bot_username) setBotUsername(r.bot_username);
      } catch {}
    })();
    return () => { cancelled = true; };
  }, []);

  useEffect(() => {
    if (!botUsername || !containerRef.current) return;
    if (!/^[a-zA-Z0-9_]{3,32}$/.test(botUsername)) return;
    // Expose the callback globally so Telegram's widget can call it
    window.onTelegramAuth = (user) => onLogin(user);
    // Clear previous widget
    containerRef.current.innerHTML = "";
    const script = document.createElement("script");
    script.async = true;
    script.src = "https://telegram.org/js/telegram-widget.js?22";
    script.setAttribute("data-telegram-login", botUsername);
    script.setAttribute("data-size", "medium");
    script.setAttribute("data-radius", "4");
    script.setAttribute("data-onauth", "onTelegramAuth(user)");
    script.setAttribute("data-request-access", "write");
    containerRef.current.appendChild(script);
  }, [botUsername, onLogin]);

  if (!botUsername) {
    return <span style={{color:"var(--muted)",fontSize:11}}>…</span>;
  }
  return <div ref={containerRef} style={{display:"inline-block"}} />;
}

// ─── Network Metrics Table ───────────────────────────────────────────────────
function NetworkMetricsTable({ networkStats, treasuryLpt, lptPriceUsd, onSelectMetric }) {
  const [prevRound, setPrevRound] = useState(null);
  const [prevDay, setPrevDay] = useState(null);
  const [todayDay, setTodayDay] = useState(null);
  const [sparks, setSparks] = useState({});
  const [prevTreasuryLpt, setPrevTreasuryLpt] = useState(null);

  // Fetch previous round stats
  useEffect(() => {
    (async () => {
      try {
        if (networkStats.latest_round) {
          const prevRoundId = Number(networkStats.latest_round) - 1;
          const r = await api(`/rounds/${prevRoundId}`).catch(() => null);
          if (r) setPrevRound(r);
        }
      } catch (e) { console.warn("Prev round fetch failed:", e.message); }
    })();
  }, [networkStats.latest_round]);

  // Fetch sparklines (90 days) + last two days for stat cards + treasury delta
  useEffect(() => {
    (async () => {
      try {
        const [roundsRes, dailyRes, treasuryRes] = await Promise.all([
          api(`/rounds`, { limit: 30 }).catch(() => null),
          backend(`/daily/history?days=90`).catch(() => null),
          backend(`/treasury/history?days=90`).catch(() => null),
        ]);

        const rounds = (roundsRes?.data || []).slice().reverse();
        const daily = dailyRes?.history || [];
        const treasuryHistory = treasuryRes?.history || [];

        // Last two complete days → stat card + delta
        if (daily.length >= 1) {
          const latest = daily[daily.length - 1];
          setTodayDay({ payouts: latest.payouts_usd, rewards: latest.rewards_usd, date: latest.date });
        }
        if (daily.length >= 2) {
          const prev = daily[daily.length - 2];
          setPrevDay({ payouts: prev.payouts_usd, rewards: prev.rewards_usd });
        }
        if (treasuryHistory.length >= 2) {
          setPrevTreasuryLpt(treasuryHistory[treasuryHistory.length - 2].balance);
        }

        // Fallback to direct Livepeer API if KV not seeded yet
        let payoutsSpark = daily.map(d => ({ x: d.date, y: d.payouts_usd }));
        let rewardsSpark = daily.map(d => ({ x: d.date, y: d.rewards_usd }));
        if (payoutsSpark.length === 0) {
          const today30 = new Date(); const from30 = new Date(); from30.setDate(from30.getDate() - 30);
          const fromStr = from30.toISOString().slice(0, 10); const toStr = today30.toISOString().slice(0, 10);
          const [pa, ra] = await Promise.all([
            api(`/aggregations/events`, { contract: "TicketBroker", event_name: "WinningTicketRedeemed",
              bucket: "day", metric: "sum_amount_usd", from: fromStr, to: toStr }).catch(() => null),
            api(`/aggregations/events`, { contract: "BondingManager", event_name: "Reward",
              bucket: "day", metric: "sum_amount_usd", from: fromStr, to: toStr }).catch(() => null),
          ]);
          payoutsSpark = (pa?.results || []).map(b => ({ x: b.bucket_start, y: Number(b.value || 0) }));
          rewardsSpark = (ra?.results || []).map(b => ({ x: b.bucket_start, y: Number(b.value || 0) }));
          // Also populate stat cards from fallback data
          if (payoutsSpark.length >= 1) {
            const l = payoutsSpark[payoutsSpark.length - 1];
            const lr = rewardsSpark[rewardsSpark.length - 1];
            setTodayDay({ payouts: l.y, rewards: lr?.y ?? null, date: l.x });
          }
          if (payoutsSpark.length >= 2) {
            const p = payoutsSpark[payoutsSpark.length - 2];
            const pr = rewardsSpark[rewardsSpark.length - 2];
            setPrevDay({ payouts: p.y, rewards: pr?.y ?? null });
          }
        }

        setSparks({
          active_orchs: rounds.map(r => ({ x: r.started_at, y: r.active_orchestrators })),
          total_stake: rounds.map(r => ({ x: r.started_at, y: Number(r.total_lpt_staked) })),
          payouts: payoutsSpark,
          rewards: rewardsSpark,
          treasury: treasuryHistory.map(t => ({ x: t.date, y: t.balance })),
        });
      } catch (e) { console.warn("Metrics fetch failed:", e.message); }
    })();
  }, []);

  const fmtPayouts = (val) => val != null ? usd(val) : "—";

  const metrics = [
    {
      key: "active_orchs",
      label: "Active Orchs",
      value: networkStats.active_orchestrators,
      formatted: networkStats.active_orchestrators,
      prev: prevRound?.active_orchestrators,
      formatDelta: (d) => (d > 0 ? "+" : "") + d,
      cls: "",
      spark_color: "var(--accent)",
    },
    {
      key: "total_stake",
      label: "Total LPT Staked",
      value: Number(networkStats.total_lpt_staked),
      formatted: lpt(networkStats.total_lpt_staked, 0),
      prev: prevRound?.total_lpt_staked ? Number(prevRound.total_lpt_staked) : null,
      formatDelta: (d) => (d > 0 ? "+" : "") + d.toFixed(2) + " LPT",
      cls: "accent",
      spark_color: "var(--accent)",
    },
    {
      key: "payouts",
      label: todayDay?.date ? `Payouts ${todayDay.date}` : "Payouts",
      value: todayDay?.payouts != null ? Number(todayDay.payouts) : null,
      formatted: fmtPayouts(todayDay?.payouts),
      prev: prevDay?.payouts != null ? Number(prevDay.payouts) : null,
      formatDelta: (d) => (d > 0 ? "+" : "") + usd(d),
      cls: "",
      spark_color: "var(--accent)",
    },
    {
      key: "treasury",
      label: "Treasury LPT",
      value: treasuryLpt,
      formatted: treasuryLpt != null
        ? lpt(treasuryLpt, 2) + (lptPriceUsd != null ? `  (~${usd(treasuryLpt * lptPriceUsd)})` : "")
        : "Loading…",
      prev: prevTreasuryLpt,
      formatDelta: (d) => (d > 0 ? "+" : "") + d.toFixed(2) + " LPT",
      cls: "accent2",
      spark_color: "var(--accent2)",
    },
  ];

  return (
    <table className="metrics-table">
      <thead>
        <tr>
          <th>Metric</th>
          <th>Current</th>
          <th>Δ vs prev</th>
          <th>30d trend</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        {metrics.map(m => {
          const delta = (m.prev != null && m.value != null) ? Number(m.value) - Number(m.prev) : null;
          const deltaCls = delta == null ? "flat" : delta > 0 ? "up" : delta < 0 ? "down" : "flat";
          const deltaStr = delta == null ? "—" : m.formatDelta(delta);
          const series = sparks[m.key] || [];
          return (
            <tr key={m.key} onClick={() => onSelectMetric(m)}>
              <td className="metric-label">{m.label}</td>
              <td className={`metric-value ${m.cls}`}>{m.formatted}</td>
              <td>
                <span className={`metric-delta ${deltaCls}`}>{delta != null ? (delta > 0 ? "↑ " : delta < 0 ? "↓ " : "") + deltaStr : "—"}</span>
              </td>
              <td>
                {series.length > 0
                  ? <Sparkline data={series} color={m.spark_color} />
                  : <span style={{color:"var(--muted)",fontSize:10}}>—</span>}
              </td>
              <td className="metric-arrow">→</td>
            </tr>
          );
        })}
      </tbody>
    </table>
  );
}

// ─── Sparkline (small SVG line) ──────────────────────────────────────────────
function Sparkline({ data, color = "var(--accent)", width = 100, height = 28 }) {
  // Filter out invalid points
  const clean = (data || []).filter(d => d && d.x != null && d.y != null && !isNaN(Number(d.y)));
  if (clean.length === 0) return <span style={{color:"var(--muted)",fontSize:10}}>—</span>;
  if (clean.length === 1) return <span style={{color:"var(--muted)",fontSize:10}}>1 point</span>;

  const values = clean.map(d => Number(d.y));
  const min = Math.min(...values);
  const max = Math.max(...values);
  const range = max - min || 1;
  const step = width / (clean.length - 1);
  const points = clean.map((d, i) => {
    const x = i * step;
    const y = height - ((Number(d.y) - min) / range) * height;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  return (
    <svg className="metric-spark" width={width} height={height} viewBox={`0 0 ${width} ${height}`}>
      <polyline points={points} fill="none" stroke={color} strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round" />
    </svg>
  );
}

// ─── Metric Chart Modal ──────────────────────────────────────────────────────
function MetricChartModal({ metric, lptPriceUsd, onClose }) {
  const [range, setRange] = useState("30d"); // 1d, 7d, 30d, 90d
  const [data, setData] = useState([]);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);

  const rangeDays = { "1d": 1, "7d": 7, "30d": 30, "90d": 90 }[range];

  useEffect(() => {
    let cancelled = false;
    (async () => {
      setLoading(true); setError(null);
      try {
        let series = [];
        const from = new Date(); from.setDate(from.getDate() - rangeDays);

        if (metric.key === "total_stake" || metric.key === "active_orchs") {
          // Always fetch at least 30 rounds to ensure we have enough points
          // (Rounds API ignores time bounds, just give us recent rounds)
          const fetchLimit = Math.max(rangeDays, 30);
          const res = await api(`/rounds`, { limit: fetchLimit });
          const rounds = (res?.data || []).slice().reverse(); // oldest first
          // Slice to requested range
          const cutoff = from.getTime();
          const filtered = rounds.filter(r => new Date(r.started_at).getTime() >= cutoff);
          const finalRounds = filtered.length >= 2 ? filtered : rounds; // fallback to all
          if (metric.key === "total_stake") {
            series = finalRounds.map(r => ({ x: r.started_at, y: Number(r.total_lpt_staked) }));
          } else {
            series = finalRounds.map(r => ({ x: r.started_at, y: r.active_orchestrators }));
          }
        } else if (metric.key === "payouts" || metric.key === "rewards") {
          const histRes = await backend(`/daily/history?days=${rangeDays}`).catch(() => null);
          const field = metric.key === "payouts" ? "payouts_usd" : "rewards_usd";
          series = (histRes?.history || []).map(d => ({ x: d.date, y: d[field] }));
          if (series.length === 0) {
            // Fallback to Livepeer API when KV not seeded
            const eventName = metric.key === "payouts" ? "WinningTicketRedeemed" : "Reward";
            const contract = metric.key === "payouts" ? "TicketBroker" : "BondingManager";
            const res = await api(`/aggregations/events`, {
              contract, event_name: eventName, bucket: "day", metric: "sum_amount_usd",
              from: from.toISOString().slice(0, 10), to: new Date().toISOString().slice(0, 10),
            }).catch(() => null);
            series = (res?.results || []).map(b => ({ x: b.bucket_start, y: Number(b.value || 0) }));
          }
        } else if (metric.key === "treasury") {
          const res = await backend(`/treasury/history?days=${rangeDays}`);
          series = (res?.history || []).map(t => ({ x: t.date, y: t.balance }));
        }

        if (!cancelled) setData(series);
      } catch (e) {
        if (!cancelled) setError(e.message);
      } finally {
        if (!cancelled) setLoading(false);
      }
    })();
    return () => { cancelled = true; };
  }, [metric.key, range, rangeDays]);

  // Compute chart stats
  const values = data.map(d => Number(d.y) || 0);
  const min = values.length ? Math.min(...values) : 0;
  const max = values.length ? Math.max(...values) : 0;
  const avg = values.length ? values.reduce((a, b) => a + b, 0) / values.length : 0;
  const total = values.reduce((a, b) => a + b, 0);
  const first = values[0] || 0;
  const last = values[values.length - 1] || 0;
  const change = last - first;
  const changePct = first !== 0 ? (change / first) * 100 : 0;

  const isUsd = metric.key === "payouts" || metric.key === "rewards";
  const isLpt = metric.key === "total_stake" || metric.key === "treasury";
  const formatVal = (v) => {
    if (isUsd) return usd(v);
    if (isLpt) return lpt(v, 0);
    return Number(v).toLocaleString(undefined, { maximumFractionDigits: 0 });
  };

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal chart-modal" onClick={e => e.stopPropagation()}>
        <button className="modal-close" onClick={onClose}>✕</button>
        <div className="modal-title">{metric.label}</div>

        <div className="chart-header">
          <div>
            <div className="chart-current-label">Current</div>
            <div className={`chart-current ${metric.cls}`}>{metric.formatted}</div>
          </div>
          <div className="chart-range-tabs">
            {["1d", "7d", "30d", "90d"].map(r => (
              <button key={r} className={`chart-range-tab ${range === r ? "active" : ""}`} onClick={() => setRange(r)}>{r}</button>
            ))}
          </div>
        </div>

        {loading && <div className="chart-empty"><span className="spinner" />Loading {range} chart…</div>}
        {error && <div className="error-msg">⚠ {error}</div>}
        {!loading && !error && data.length < 2 && (
          <div className="chart-empty">
            {metric.key === "treasury"
              ? <>Treasury history is being collected once a day.<br />Check back tomorrow for the first chart.</>
              : <>Not enough data points yet for the {range} chart.<br />Try a longer range or check back later.</>}
          </div>
        )}
        {!loading && !error && data.length >= 2 && (
          <>
            <LineChart data={data} formatVal={formatVal} color={metric.cls === "accent2" ? "var(--accent2)" : "var(--accent)"} />
            <div className="chart-stats">
              <div><div className="chart-stat-label">Start</div><div className="chart-stat-value">{formatVal(first)}</div></div>
              <div><div className="chart-stat-label">End</div><div className="chart-stat-value">{formatVal(last)}</div></div>
              <div><div className="chart-stat-label">Change</div><div className="chart-stat-value" style={{color: change > 0 ? "var(--accent)" : change < 0 ? "var(--danger)" : "var(--text)"}}>
                {change > 0 ? "+" : ""}{formatVal(change)} ({changePct > 0 ? "+" : ""}{changePct.toFixed(2)}%)
              </div></div>
              <div><div className="chart-stat-label">Min</div><div className="chart-stat-value">{formatVal(min)}</div></div>
              <div><div className="chart-stat-label">Max</div><div className="chart-stat-value">{formatVal(max)}</div></div>
              <div><div className="chart-stat-label">Avg</div><div className="chart-stat-value">{formatVal(avg)}</div></div>
              {isUsd && <div><div className="chart-stat-label">Total ({range})</div><div className="chart-stat-value">{formatVal(total)}</div></div>}
            </div>
          </>
        )}
      </div>
    </div>
  );
}

// ─── Line Chart (full size with axes) ────────────────────────────────────────
function LineChart({ data, formatVal, color = "var(--accent)" }) {
  const [hover, setHover] = useState(null);
  const svgRef = useRef(null);

  const W = 800, H = 320;
  const PAD_L = 64, PAD_R = 16, PAD_T = 16, PAD_B = 40;
  const innerW = W - PAD_L - PAD_R;
  const innerH = H - PAD_T - PAD_B;

  // Filter out null/NaN points
  const clean = (data || []).filter(d => d && d.x != null && d.y != null && !isNaN(Number(d.y)));
  if (clean.length < 2) return <div className="chart-empty">Not enough data points to draw chart.</div>;

  const values = clean.map(d => Number(d.y));
  const min = Math.min(...values);
  const max = Math.max(...values);
  const range = max - min || 1;
  const padding = range * 0.1;
  const yMin = Math.max(0, min - padding);
  const yMax = max + padding;
  const yRange = yMax - yMin || 1;

  const xStep = innerW / (clean.length - 1 || 1);
  const points = clean.map((d, i) => {
    const x = PAD_L + i * xStep;
    const y = PAD_T + innerH - ((Number(d.y) - yMin) / yRange) * innerH;
    return { x, y, dx: d.x, dy: Number(d.y) };
  });
  const pathD = points.map((p, i) => `${i === 0 ? "M" : "L"} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(" ");
  const areaD = `${pathD} L ${points[points.length - 1].x.toFixed(1)} ${PAD_T + innerH} L ${PAD_L} ${PAD_T + innerH} Z`;

  // Y-axis gridlines (5 of them)
  const ySteps = 5;
  const yLines = Array.from({ length: ySteps + 1 }, (_, i) => {
    const value = yMin + (yRange * i) / ySteps;
    const y = PAD_T + innerH - (i / ySteps) * innerH;
    return { value, y };
  });

  // X-axis labels (up to 5 evenly-spaced)
  const xLabelCount = Math.min(5, clean.length);
  const xLabels = Array.from({ length: xLabelCount }, (_, i) => {
    const idx = xLabelCount > 1
      ? Math.floor((clean.length - 1) * i / (xLabelCount - 1))
      : 0;
    return { idx, x: PAD_L + idx * xStep, label: new Date(clean[idx].x).toLocaleDateString(undefined, { day: "2-digit", month: "short" }) };
  });

  const handleMove = (e) => {
    const svg = svgRef.current;
    if (!svg) return;
    const rect = svg.getBoundingClientRect();
    const mx = ((e.clientX - rect.left) / rect.width) * W;
    // Find closest point
    let closest = null, closestDist = Infinity;
    for (const p of points) {
      const d = Math.abs(p.x - mx);
      if (d < closestDist) { closestDist = d; closest = p; }
    }
    setHover(closest);
  };

  return (
    <div style={{position:"relative"}}>
      <svg ref={svgRef} className="chart-svg" viewBox={`0 0 ${W} ${H}`} onMouseMove={handleMove} onMouseLeave={() => setHover(null)} preserveAspectRatio="none">
        {/* Gridlines */}
        {yLines.map((g, i) => (
          <g key={i}>
            <line className="chart-grid-line" x1={PAD_L} y1={g.y} x2={W - PAD_R} y2={g.y} />
            <text className="chart-axis-label" x={PAD_L - 8} y={g.y + 4} textAnchor="end">{formatVal(g.value)}</text>
          </g>
        ))}
        {/* X-axis labels */}
        {xLabels.map((l, i) => (
          <text key={i} className="chart-axis-label" x={l.x} y={H - PAD_B + 18} textAnchor="middle">{l.label}</text>
        ))}
        {/* Area fill */}
        <path className="chart-area" d={areaD} fill={color} />
        {/* Line */}
        <path d={pathD} fill="none" stroke={color} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" />
        {/* Hover indicator */}
        {hover && (
          <>
            <line x1={hover.x} y1={PAD_T} x2={hover.x} y2={PAD_T + innerH} stroke={color} strokeWidth="1" strokeDasharray="3,3" opacity="0.5" />
            <circle cx={hover.x} cy={hover.y} r="5" fill={color} stroke="var(--bg)" strokeWidth="2" />
          </>
        )}
      </svg>
      {hover && (
        <div className="chart-tooltip" style={{
          left: `${(hover.x / W) * 100}%`,
          top: `${(hover.y / H) * 100}%`,
          transform: "translate(-50%, -120%)",
        }}>
          <div style={{color:"var(--muted)",fontSize:10,marginBottom:2}}>{new Date(hover.dx).toLocaleDateString(undefined, {day:"2-digit",month:"short",year:"numeric"})}</div>
          <div style={{color:color,fontWeight:600}}>{formatVal(hover.dy)}</div>
        </div>
      )}
    </div>
  );
}

// ─── Export Modal ─────────────────────────────────────────────────────────────
function ExportModal({ wallet, orchestrator, activeDelegation, cutsHistory, onClose }) {
  const [period, setPeriod] = useState("90d");
  const [fields, setFields] = useState({ rewards: true, cuts: true });
  const [busy, setBusy] = useState(false);
  const [progress, setProgress] = useState("");
  const [error, setError] = useState(null);

  const orchAddr = orchestrator?.address;
  const myStake = Number(activeDelegation?.bonded_principal || 0);
  const totalStake = Number(orchestrator?.total_stake || 0);
  const myShareFrac = totalStake > 0 ? myStake / totalStake : 0;

  const periodMs = { "30d": 30, "90d": 90, "180d": 180, "1y": 365, "all": null }[period];
  const fromDate = periodMs ? new Date(Date.now() - periodMs * 86400_000) : new Date(0);

  const esc = (v) => {
    const s = String(v ?? "");
    return (s.includes(",") || s.includes('"') || s.includes("\n"))
      ? `"${s.replace(/"/g, '""')}"` : s;
  };

  const downloadCsv = (filename, rows) => {
    const blob = new Blob([rows.join("\n")], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  };

  const fetchAllRewardEvents = async (orchAddr, fromDate) => {
    let cursor = null, all = [], page = 0;
    do {
      page++;
      setProgress(`Fetching reward events… page ${page}`);
      const params = { contract: "BondingManager", event_name: "Reward", address: orchAddr,
        with_valuations: true, sort: "block_desc", limit: 100 };
      if (cursor) params.cursor = cursor;
      const res = await api(`/events`, params);
      const batch = res.data || [];
      all = [...all, ...batch];
      cursor = res.next_cursor || null;
      if (batch.length === 0) break; // no more data
      if (new Date(batch[batch.length - 1].block_timestamp) < fromDate) break;
    } while (cursor && all.length < 2000);
    return all.filter(ev => new Date(ev.block_timestamp) >= fromDate);
  };

  const fetchBlockToRoundMap = async (orchAddr) => {
    try {
      const res = await api(`/orchestrators/${orchAddr}/stake-history`);
      const sorted = (res.data || []).slice().sort((a, b) => Number(a.block_number) - Number(b.block_number));
      return (blockNum) => {
        const bn = Number(blockNum);
        let round = null;
        for (const s of sorted) { if (Number(s.block_number) <= bn) round = s.round; else break; }
        return round;
      };
    } catch { return () => null; }
  };

  const handleExport = async () => {
    if (!orchAddr) { setError("No orchestrator loaded."); return; }
    setBusy(true); setError(null); setProgress("");
    const dateStr = new Date().toISOString().slice(0, 10);
    const wShort = wallet.slice(0, 8);
    try {
      if (fields.rewards) {
        const [events, blockToRound] = await Promise.all([
          fetchAllRewardEvents(orchAddr, fromDate),
          fetchBlockToRoundMap(orchAddr),
        ]);
        setProgress(`Building rewards CSV (${events.length} events)…`);

        // cuts sorted ascending for historical cut lookup per block
        const sortedCuts = [...cutsHistory].sort((a, b) => Number(a.block_number) - Number(b.block_number));
        const cutAtBlock = (blockNum) => {
          let cut = sortedCuts[0];
          for (const c of sortedCuts) { if (Number(c.block_number) <= Number(blockNum)) cut = c; else break; }
          return cut;
        };

        const header = ["Round","Date (UTC)","Block","Total LPT Minted",
          "Orch Cut %","Orch Share LPT","Delegators Share LPT",
          "Your Stake %","Your Share LPT",
          "LPT Price USD","Total USD","Orch USD","Delegators USD","Your Share USD"].join(",");

        const rows = [header];
        for (const ev of [...events].reverse()) {
          const round = blockToRound(ev.block_number) ?? "";
          const date = new Date(ev.block_timestamp).toISOString().slice(0, 19).replace("T", " ");
          const totalLpt = Number(ev.amount_native || 0);
          const valuation = (ev.valuations || []).find(v => v.asset === "LPT");
          const totalUsd = valuation ? Number(valuation.amount_usd || 0) : null;
          const lptPrice = valuation ? Number(valuation.native_usd_price || 0) : null;
          const cut = cutAtBlock(ev.block_number);
          const rcPct = cut ? Number(cut.reward_cut_percent) : 0;
          const rcFrac = rcPct / 100;
          const orchLpt = totalLpt * rcFrac;
          const delLpt = totalLpt - orchLpt;
          const orchUsd = totalUsd != null ? totalUsd * rcFrac : null;
          const delUsd = totalUsd != null ? totalUsd - orchUsd : null;
          const myLpt = delLpt * myShareFrac;
          const myUsd = delUsd != null ? delUsd * myShareFrac : null;
          rows.push([
            round, date, ev.block_number,
            totalLpt.toFixed(6), rcPct.toFixed(2),
            orchLpt.toFixed(6), delLpt.toFixed(6),
            (myShareFrac * 100).toFixed(4), myLpt.toFixed(6),
            lptPrice != null ? lptPrice.toFixed(4) : "",
            totalUsd != null ? totalUsd.toFixed(2) : "",
            orchUsd != null ? orchUsd.toFixed(2) : "",
            delUsd != null ? delUsd.toFixed(2) : "",
            myUsd != null ? myUsd.toFixed(4) : "",
          ].map(esc).join(","));
        }
        downloadCsv(`livewatch_rewards_${wShort}_${dateStr}.csv`, rows);
      }

      if (fields.cuts) {
        setProgress("Building cut history CSV…");
        const filteredCuts = cutsHistory
          .filter(c => new Date(c.block_timestamp) >= fromDate)
          .slice().sort((a, b) => Number(a.block_number) - Number(b.block_number));
        const rows = [
          ["Date (UTC)","Block","Event ID","Reward Cut %","Fee Cut %","Fee Share %"].join(","),
          ...filteredCuts.map(c => [
            new Date(c.block_timestamp).toISOString().slice(0,19).replace("T"," "),
            c.block_number, c.event_id,
            Number(c.reward_cut_percent).toFixed(2),
            Number(c.fee_cut_percent).toFixed(2),
            Number(c.fee_share_percent).toFixed(2),
          ].map(esc).join(","))
        ];
        downloadCsv(`livewatch_cuts_${wShort}_${dateStr}.csv`, rows);
      }

      setProgress(`Done. CSV download(s) started.`);
    } catch (e) {
      setError(e.message);
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <button className="modal-close" onClick={onClose}>✕</button>
        <div className="modal-title">Export Data</div>
        <div className="modal-subtitle">
          Wallet <code style={{color:"var(--accent)"}}>{shortAddr(wallet)}</code> · Orch <code style={{color:"var(--accent2)"}}>{orchestrator?.display_name || shortAddr(orchAddr)}</code>
        </div>

        <div className="form-group">
          <label className="form-label">Time Period</label>
          <div className="toggle-group" style={{flexWrap:"wrap"}}>
            {[["30d","30d"],["90d","90d"],["180d","180d"],["1y","1 year"],["all","All time"]].map(([val, label]) => (
              <button key={val} className={`toggle-opt ${period === val ? "active" : ""}`} onClick={() => setPeriod(val)}>{label}</button>
            ))}
          </div>
        </div>

        <div className="form-group">
          <label className="form-label">Data to Export</label>
          <div className="checkbox-group">
            <label className="checkbox-item">
              <input type="checkbox" checked={fields.rewards} onChange={e => setFields(f => ({...f, rewards: e.target.checked}))} />
              <div className="ck-text">
                <div className="ck-title">LPT Reward Events</div>
                <div className="ck-desc">Per-round: total minted, orch share, delegators share, your estimated share, USD value at claim time. Round number included.</div>
              </div>
            </label>
            <label className="checkbox-item">
              <input type="checkbox" checked={fields.cuts} onChange={e => setFields(f => ({...f, cuts: e.target.checked}))} />
              <div className="ck-text">
                <div className="ck-title">Cut Change History</div>
                <div className="ck-desc">All reward cut and fee cut changes with timestamps and block numbers.</div>
              </div>
            </label>
          </div>
        </div>

        <div style={{fontSize:11,color:"var(--muted)",marginBottom:20,padding:12,background:"var(--bg)",border:"1px solid var(--border)",borderRadius:4,lineHeight:1.6}}>
          💡 <strong>Your share</strong> is estimated proportionally (your bonded / total orch stake × delegators portion). Historical stake changes not accounted for — share fraction uses current snapshot.
        </div>

        {error && <div className="error-msg">⚠ {error}</div>}
        {progress && !error && <div style={{fontSize:11,color:"var(--muted)",marginBottom:12}}><span className={busy ? "spinner" : ""} />{progress}</div>}

        <button className="btn" style={{width:"100%"}} onClick={handleExport}
          disabled={busy || (!fields.rewards && !fields.cuts)}>
          {busy ? <><span className="spinner"/>Exporting…</> : "⬇ Download CSV"}
        </button>
      </div>
    </div>
  );
}

// ─── Service Worker registration ──────────────────────────────────────────────
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").then(reg => {
      // Register for periodic background sync if available (Chrome/Android PWA)
      if ("periodicSync" in reg) {
        navigator.permissions.query({ name: "periodic-background-sync" }).then(status => {
          if (status.state === "granted") {
            reg.periodicSync.register("lw-missed-reward", { minInterval: 15 * 60 * 1000 })
              .catch(() => {});
          }
        }).catch(() => {});
      }
    }).catch(() => {});
  });
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
