name = "livewatch-backend"
main = "worker.js"
compatibility_date = "2024-12-01"

# ───── Cron Trigger ─────
# Runs every 30 minutes
[triggers]
crons = ["*/30 * * * *"]

# ───── Public vars ─────
[vars]
LIVEPEER_API_BASE = "https://livepeer-network-api.cloudspe.com/api/v1"
TELEGRAM_BOT_USERNAME = "YourBotUsername"   # <-- replace with your bot's username (no @)

# ───── KV Namespaces ─────
# Replace the placeholder IDs after running: wrangler kv namespace create <NAME>
[[kv_namespaces]]
binding = "SUBS"
id = "7ee612e7501e4e1a8c2ce9753f46d2f3"

[[kv_namespaces]]
binding = "SNAP"
id = "9b92e2bd8f5746ed988f78c28e5d5ad4"

[[kv_namespaces]]
binding = "CODES"
id = "9cccd98c1c7847c9aa7cae2d220e97d3"

# ───── Secrets (set via CLI, NOT here) ─────
# Run: wrangler secret put TELEGRAM_BOT_TOKEN
